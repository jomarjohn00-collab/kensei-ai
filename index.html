<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kensei AI</title>
<style>
  :root {
    --bg:#f5f6fa; --panel:#ffffff; --ink:#1a1d29; --mute:#6a7086; --line:#dfe2ec; --accent:#3d4fd6; --on-accent:#ffffff; --me:#e8ebfb; --code:#12151f; --codehead:#1c2030; --codeink:#e6e9f5;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#0f1117; --panel:#181b25; --ink:#e9ecf5; --mute:#8d94ab; --line:#2a2f40; --accent:#7b8bff; --on-accent:#0b0d18; --me:#232842; --code:#0a0c12; --codehead:#141824; --codeink:#e6e9f5; } }
  :root[data-theme="dark"] {
    --bg:#0f1117; --panel:#181b25; --ink:#e9ecf5; --mute:#8d94ab; --line:#2a2f40; --accent:#7b8bff; --on-accent:#0b0d18; --me:#232842; --code:#0a0c12; --codehead:#141824; --codeink:#e6e9f5; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--ink); font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  #shell { height:100%; display:flex; }
  #main { flex:1; min-width:0; height:100%; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:10px; padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  .logo { width:34px; height:34px; flex:none; filter:drop-shadow(0 3px 8px rgba(61,79,214,.35)); }
  header h1 { margin:0; font-size:18px; flex:1; letter-spacing:.2px; }
  button { font:inherit; cursor:pointer; }
  .ghost { background:transparent; color:var(--mute); border:1px solid var(--line); border-radius:9px; padding:6px 11px; font-size:14px; }
  #chat { flex:1; overflow-y:auto; padding:16px; max-width:820px; width:100%; margin:0 auto; }
  .empty { text-align:center; color:var(--mute); margin-top:12vh; }
  .empty h2 { color:var(--ink); margin:0 0 6px; font-size:22px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:16px; }
  .chip { background:var(--panel); border:1px solid var(--line); color:var(--ink); border-radius:999px; padding:8px 14px; font-size:14px; }
  .msg { margin:0 0 14px; padding:11px 14px; border-radius:14px; overflow-wrap:anywhere; }
  .user { background:var(--me); margin-left:12%; }
  .ai { background:var(--panel); border:1px solid var(--line); }
  .ai h3 { font-size:16px; margin:14px 0 6px; color:var(--accent); }
  .ai h3:first-child { margin-top:0; }
  .ai p { margin:6px 0; } .ai ul,.ai ol { margin:6px 0; padding-left:22px; } .ai li { margin:3px 0; }
  .ai :not(pre) > code { background:var(--bg); border:1px solid var(--line); padding:1px 6px; border-radius:5px; font:13px ui-monospace,Menlo,Consolas,monospace; }
  .block { margin:10px 0; border-radius:10px; overflow:hidden; background:var(--code); border:1px solid var(--line); }
  .bhead { display:flex; align-items:center; gap:6px; padding:6px 8px 6px 12px; background:var(--codehead); font-size:12px; color:#9aa2bd; }
  .bhead span { flex:1; }
  .bhead button { padding:3px 10px; font-size:12px; background:transparent; color:var(--codeink); border:1px solid #394058; border-radius:7px; }
  .bhead .run { background:var(--accent); color:var(--on-accent); border:0; font-weight:700; }
  .block pre { margin:0; padding:12px; overflow-x:auto; }
  .block code { font:13px/1.5 ui-monospace,Menlo,Consolas,monospace; color:var(--codeink); }
  .hljs-keyword,.hljs-built_in,.hljs-literal { color:#c792ea; } .hljs-string,.hljs-attr { color:#a5e075; } .hljs-number { color:#f78c6c; }
  .hljs-comment { color:#6b7787; font-style:italic; } .hljs-title,.hljs-function { color:#82aaff; } .hljs-tag,.hljs-name { color:#f07178; }
  form { display:flex; gap:8px; align-items:flex-end; position:relative; padding:10px 16px 14px; max-width:820px; width:100%; margin:0 auto; }
  textarea { flex:1; resize:none; height:48px; max-height:140px; font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:11px 12px; }
  textarea:focus,button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  #send { background:var(--accent); color:var(--on-accent); border:0; border-radius:12px; padding:0 18px; font-weight:700; height:48px; }
  #send:disabled { opacity:.5; }
  .ic { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  .round { width:48px; height:48px; flex:none; display:grid; place-items:center; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:12px; padding:0; }
  .round.rec { background:#e5484d; color:#fff; border-color:#e5484d; animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity:.65; } }
  @media (prefers-reduced-motion: reduce) { .round.rec { animation:none; } }
  #menu { position:absolute; left:16px; bottom:calc(100% - 6px); background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:6px; display:none; flex-direction:column; min-width:190px; box-shadow:0 10px 30px rgba(0,0,0,.25); z-index:5; }
  #menu.on { display:flex; }
  #menu button, #menu .mi { display:flex; align-items:center; gap:12px; background:transparent; border:0; color:var(--ink); padding:12px; border-radius:9px; text-align:left; font-size:15px; cursor:pointer; }
  #menu button:hover, #menu .mi:hover { background:var(--me); }
  .pick { position:fixed; left:0; bottom:0; width:1px; height:1px; opacity:0; pointer-events:none; }
  #tray { display:flex; gap:8px; flex-wrap:wrap; padding:0 16px; max-width:820px; width:100%; margin:0 auto; }
  #tray:empty { display:none; }
  .att { display:flex; align-items:center; gap:6px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:4px 4px 4px 4px; font-size:13px; max-width:210px; }
  .att img { width:34px; height:34px; object-fit:cover; border-radius:6px; }
  .att span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding-left:4px; }
  .att button { background:transparent; border:0; color:var(--mute); font-size:18px; padding:0 6px; }
  #sv { position:fixed; inset:0; background:var(--bg); display:none; flex-direction:column; z-index:10; padding-top:env(safe-area-inset-top,0px); }
  #sv.on { display:flex; }
  #sv .bar2 { display:flex; align-items:center; gap:8px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  #sv .bar2 span { flex:1; font-weight:600; }
  #svlist { flex:1; overflow-y:auto; padding:14px 16px; max-width:820px; width:100%; margin:0 auto; }
  .sitem { display:flex; gap:8px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; }
  .sitem .t { flex:1; min-width:0; text-align:left; background:transparent; border:0; color:var(--ink); font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #note { text-align:center; font-size:12px; color:var(--mute); padding:0 16px 8px; }
  .tools { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .tools button { background:transparent; border:1px solid var(--line); color:var(--ink); border-radius:9px; padding:7px 12px; font-size:13px; }
  .tools button:hover { background:var(--me); }
  #prog { max-width:820px; width:100%; margin:0 auto; padding:8px 16px 0; }
  #prog[hidden] { display:none; }
  .pbar { height:4px; border-radius:4px; background:var(--line); overflow:hidden; }
  .pbar i { display:block; height:100%; width:0; background:var(--accent); transition:width .5s ease; }
  .prow { display:flex; align-items:center; gap:10px; padding:6px 0 2px; font-size:13px; color:var(--mute); }
  #plabel { flex:1; }
  #plabel::after { content:""; animation:dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content:""; } 25% { content:"."; } 50% { content:".."; } 75% { content:"..."; } }
  #pstop { padding:3px 12px; font-size:13px; }
  @media (prefers-reduced-motion: reduce) { #plabel::after { animation:none; content:"..."; } .pbar i { transition:none; } }
  .art { margin:12px 0; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--panel); }
  .art [hidden] { display:none !important; }
  .arthead { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 12px; border-bottom:1px solid var(--line); }
  .arthead strong { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tabs { display:flex; gap:4px; flex:none; }
  .tabs button { background:transparent; border:1px solid var(--line); color:var(--mute); border-radius:8px; padding:4px 11px; font-size:13px; }
  .tabs button.on { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .art iframe { width:100%; height:380px; border:0; background:#fff; display:block; }
  .art pre { margin:0; padding:12px; max-height:380px; overflow:auto; background:var(--code); }
  .art pre code { font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace; color:var(--codeink); white-space:pre; }
  .artacts { display:flex; flex-wrap:wrap; gap:8px; padding:10px 12px; border-top:1px solid var(--line); }
  .artacts button { background:transparent; border:1px solid var(--line); color:var(--ink); border-radius:9px; padding:7px 12px; font-size:13px; }
  .artacts button:hover { background:var(--me); }
  #pv { position:fixed; inset:0; background:var(--bg); display:none; flex-direction:column; z-index:10; padding-top:env(safe-area-inset-top,0px); }
  #pv.on { display:flex; }
  #pv .bar2 { display:flex; align-items:center; gap:8px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  #pv .bar2 span { flex:1; font-weight:600; }
  #pv iframe { flex:1; border:0; background:#fff; width:100%; }

  .hb { padding:6px 9px; display:grid; place-items:center; }
  #modes { display:flex; gap:6px; padding:8px 16px 0; max-width:820px; width:100%; margin:0 auto; overflow-x:auto; scrollbar-width:none; }
  #modes::-webkit-scrollbar { display:none; }
  #modes button { flex:none; background:transparent; border:1px solid var(--line); color:var(--mute); border-radius:999px; padding:4px 13px; font-size:13px; }
  #modes button.on { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .sitem.cur { border-color:var(--accent); }
  #sv { inset:0 auto 0 0; width:min(88vw,340px); border-right:1px solid var(--line); box-shadow:8px 0 30px rgba(0,0,0,.3); }
  #svlist { max-width:none; padding:12px; }
  @media (max-width:420px) { header .ghost { padding:6px 8px; font-size:13px; } header { gap:8px; padding:10px 12px; } }
  @media (max-height:480px) { .empty { margin-top:2vh; } }
  @media (min-width:900px) {
    #sv { position:static; inset:auto; display:flex; flex-direction:column; width:290px; flex:none; box-shadow:none; background:var(--panel); order:-1; height:100%; padding-top:0; }
    #sv .closeX, .hb, #mSaved { display:none; }
    header { padding:14px 24px; }
    #chat { padding:24px 28px; }
    .empty { margin-top:16vh; }
    .user { margin-left:20%; }
    .art iframe { height:480px; }
    .art pre { max-height:480px; }
  }
  @media (min-width:1100px) { #chat, form, #tray, #prog, #modes { max-width:920px; } #sv { width:310px; } }
  @media (min-width:1600px) { body { font-size:17px; } #chat, form, #tray, #prog, #modes { max-width:1040px; } }

/* ---- Kensei AI modern interface refresh ---- */
:root {
  --bg:#080b14; --panel:#101624; --ink:#edf2ff; --mute:#8f9bb4;
  --line:rgba(157,174,211,.16); --accent:#8b7cff; --on-accent:#fff;
  --me:#24213f; --code:#080d17; --codehead:#111a2b;
  color-scheme:dark;
}
:root[data-theme="light"] {
  --bg:#f4f6fc; --panel:#fff; --ink:#172033; --mute:#68748d;
  --line:#e1e6f0; --accent:#6655e8; --on-accent:#fff; --me:#eceaff;
  --code:#111827; --codehead:#1d293b; color-scheme:light;
}
body {
  background:
    radial-gradient(ellipse at 12% 0%, rgba(111,91,255,.17), transparent 34%),
    radial-gradient(ellipse at 90% 90%, rgba(40,166,255,.09), transparent 32%),
    var(--bg);
  letter-spacing:.01em;
}
#shell { max-width:1900px; margin:0 auto; }
#main { position:relative; }
header {
  min-height:70px; padding:13px clamp(14px,3vw,34px);
  background:rgba(12,17,29,.78); border-bottom:1px solid var(--line);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  position:relative; z-index:3;
}
:root[data-theme="light"] header { background:rgba(255,255,255,.82); }
.logo { width:39px; height:39px; border-radius:13px; }
header h1 { font-size:18px; font-weight:750; letter-spacing:-.04em; }
header h1::after {
  content:""; display:block; width:24px; height:2px; margin-top:2px;
  border-radius:9px; background:linear-gradient(90deg,var(--accent),#46c9ff);
}
.ghost {
  border-radius:11px; padding:8px 12px; border-color:var(--line);
  background:rgba(255,255,255,.025); transition:.18s ease;
}
.ghost:hover, .round:hover { border-color:rgba(139,124,255,.6); background:rgba(139,124,255,.1); color:var(--ink); }
#chat {
  max-width:900px; padding:clamp(18px,3vw,34px) clamp(14px,3vw,28px) 40px;
  scroll-behavior:smooth;
}
.empty { margin-top:clamp(9vh,17vh,170px); }
.empty h2 {
  font-size:clamp(27px,4vw,40px); letter-spacing:-.055em; font-weight:760;
  background:linear-gradient(100deg,var(--ink) 25%,#a99dff 65%,#6ed8ff);
  color:transparent; background-clip:text; -webkit-background-clip:text;
}
.empty > div:not(.chips) { color:var(--mute); font-size:15px; }
.chips { max-width:690px; margin:24px auto 0; gap:10px; }
.chip {
  border-radius:14px; padding:10px 14px; background:rgba(20,27,44,.72);
  border:1px solid var(--line); color:var(--ink); transition:transform .18s,border-color .18s,background .18s;
}
:root[data-theme="light"] .chip { background:#fff; }
.chip:hover { transform:translateY(-2px); border-color:rgba(139,124,255,.65); background:rgba(139,124,255,.1); }
.msg { border-radius:18px; padding:15px 17px; margin-bottom:18px; }
.user {
  margin-left:clamp(12%, 18%, 22%); border:1px solid rgba(139,124,255,.18);
  background:linear-gradient(135deg,rgba(91,78,180,.25),rgba(35,39,68,.86));
}
:root[data-theme="light"] .user { background:#eceaff; }
.ai { background:rgba(16,22,36,.82); border-color:var(--line); box-shadow:0 10px 30px rgba(0,0,0,.08); }
:root[data-theme="light"] .ai { background:rgba(255,255,255,.9); }
.ai h3 { letter-spacing:-.02em; }
.block { border-radius:13px; border-color:var(--line); }
.bhead { padding:9px 11px 9px 14px; }
.bhead button { border-radius:8px; padding:5px 11px; }
form {
  max-width:900px; padding:12px clamp(12px,3vw,28px) max(16px,env(safe-area-inset-bottom));
  gap:9px; align-items:flex-end;
}
textarea {
  min-height:52px; border-radius:17px; padding:13px 16px;
  background:rgba(16,22,36,.94); border-color:var(--line);
  box-shadow:0 8px 32px rgba(0,0,0,.12); transition:border-color .18s,box-shadow .18s;
}
:root[data-theme="light"] textarea { background:#fff; }
textarea:focus { border-color:rgba(139,124,255,.8); box-shadow:0 0 0 4px rgba(139,124,255,.12); outline:0; }
#send {
  min-width:78px; height:52px; border-radius:16px; padding:0 18px;
  background:linear-gradient(135deg,#8b7cff,#6655e8); box-shadow:0 7px 22px rgba(105,87,232,.24);
  transition:transform .18s,filter .18s;
}
#send:hover { filter:brightness(1.1); transform:translateY(-1px); }
.round { width:52px; height:52px; border-radius:16px; }
#mic { display:none; }
#plus { background:rgba(255,255,255,.035); }
#note { padding:4px 14px 8px; min-height:12px; }
#modes {
  max-width:900px; padding:0 clamp(12px,3vw,28px) 8px; gap:7px;
}
#modes button {
  border:1px solid var(--line); background:rgba(255,255,255,.025);
  color:var(--mute); border-radius:999px; padding:6px 12px; font-size:12px;
  transition:.18s ease;
}
#modes button:hover { color:var(--ink); border-color:rgba(139,124,255,.5); }
#modes button.on { color:#dcd7ff; background:rgba(139,124,255,.16); border-color:rgba(139,124,255,.5); }
:root[data-theme="light"] #modes button.on { color:#4938c5; }
#tray { max-width:900px; padding:0 clamp(12px,3vw,28px); }
#sv {
  background:rgba(12,17,29,.96); border-right:1px solid var(--line);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
}
:root[data-theme="light"] #sv { background:rgba(255,255,255,.96); }
#sv .bar2 { padding:18px 16px; }
#sv .bar2 span { letter-spacing:-.02em; }
#svlist { padding:14px; }
.sitem { border-radius:13px; background:rgba(255,255,255,.025); border-color:var(--line); }
.sitem.cur { border-color:rgba(139,124,255,.55); background:rgba(139,124,255,.1); }
#prog { max-width:900px; }
.pbar { background:var(--line); }
.pbar i { background:linear-gradient(90deg,#8b7cff,#5ed7ff); }
#menu { border-color:var(--line); background:var(--panel); box-shadow:0 18px 50px rgba(0,0,0,.3); }
#menu button:hover, #menu .mi:hover { background:rgba(139,124,255,.12); }
.att { border-radius:12px; background:var(--panel); border-color:var(--line); }
.art { border-radius:15px; }
.arthead { padding:11px 13px; }
.artacts { padding:11px 13px; }
#pv, #sv { color:var(--ink); }
button, textarea { -webkit-tap-highlight-color:transparent; }
button:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
@media (min-width:900px) {
  #sv { width:285px; }
  #chat { padding-top:34px; }
  .empty { margin-top:17vh; }
  form, #tray, #prog, #modes { max-width:900px; }
}
@media (max-width:600px) {
  header { min-height:62px; }
  header .ghost { padding:7px 9px; font-size:12px; }
  #chat { padding:18px 13px 28px; }
  .user { margin-left:7%; }
  .msg { padding:13px; border-radius:15px; }
  form { gap:7px; padding-top:9px; }
  #send { min-width:58px; padding:0 12px; font-size:14px; }
  .round { width:45px; height:48px; border-radius:14px; }
  #modes { overflow-x:auto; flex-wrap:nowrap; padding-bottom:10px; scrollbar-width:none; }
  #modes::-webkit-scrollbar { display:none; }
  #modes button { flex:none; }
}
@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after { scroll-behavior:auto !important; transition:none !important; animation:none !important; }
}

</style>
</head>
<body>
<div id="shell">
<div id="main">
<header>
  <button id="hb" class="ghost hb" type="button" aria-label="Chats"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7b8bff"/><stop offset="1" stop-color="#3d4fd6"/></linearGradient></defs><rect width="48" height="48" rx="14" fill="url(#lg)"/><path d="M17 11v26" stroke="#fff" stroke-width="4.5" stroke-linecap="round" fill="none"/><path d="M32 11L19 24l13 13" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M27 24h8" stroke="#bfc7ff" stroke-width="3" stroke-linecap="round"/></svg>
  <h1>Kensei AI</h1>
  <button id="theme" class="ghost" type="button">Theme</button>
  <button id="clear" class="ghost" type="button">New chat</button>
</header>
<div id="chat"></div>
<div id="prog" hidden><div class="pbar"><i id="pfill"></i></div><div class="prow"><span id="plabel"></span><span id="ptime"></span><button id="pstop" type="button" class="ghost">Stop</button></div></div>

<div id="modes" role="group" aria-label="Mode"><button type="button" data-m="auto">Auto</button><button type="button" data-m="build">Build</button><button type="button" data-m="debug">Debug</button><button type="button" data-m="explain">Explain</button><button type="button" data-m="review">Review</button></div>
<div id="tray"></div>
<form id="form">
  <div id="menu" role="menu">
    <label class="mi" for="fPhoto"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>Photos</label>

  if (!x) throw new Error("Could not read that Word file.");
  const xml = await x.async("string");
  return clip(xml.replace(/<\/w:p>/g, "\n").replace(/<w:tab\/>/g, "\t").replace(/<[^>]+>/g, "").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&apos;/g, "'"));
}
async function readPdf(f) {
  if (f.size > 20e6) throw new Error("That PDF is over 20 MB.");
  let out = "";
  try {
    if (!window.pdfjsLib) await load("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const doc = await pdfjsLib.getDocument({ data:await f.arrayBuffer() }).promise;
    for (let i = 1; i <= Math.min(doc.numPages, 40) && out.length < CAP; i++) { const p = await doc.getPage(i), c = await p.getTextContent(); out += "\n[Page " + i + "]\n" + c.items.map(x => x.str).join(" "); }
  } catch (e) { throw new Error("Could not read that PDF here. Try a photo of the page, or paste the text."); }
  if (!out.trim()) throw new Error("No readable text in that PDF (it may be scanned). Try a photo of the page instead.");
  return clip(out);
}

/* ---- voice input ---- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, base = "";
function stopVoice() { if (rec) { try { rec.stop(); } catch (e) {} } }
$("mic").onclick = () => {
  if (!SR) { note.textContent = "Voice typing is not supported in this browser."; return; }
  if (rec) { stopVoice(); return; }
  const r = new SR(); rec = r; r.lang = navigator.language || "en-US"; r.interimResults = true; r.continuous = true;
  base = input.value ? input.value.trimEnd() + " " : "";
  r.onresult = e => { let t = ""; for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript; input.value = base + t; input.dispatchEvent(new Event("input")); };
  r.onerror = e => { note.textContent = (e.error === "not-allowed" || e.error === "service-not-allowed") ? "Microphone is blocked. Allow mic access for this page in your browser settings." : "Voice error: " + e.error; };
  r.onend = () => { rec = null; $("mic").classList.remove("rec"); if (note.textContent === "Listening…") note.textContent = ""; };
  try { r.start(); $("mic").classList.add("rec"); note.textContent = "Listening…"; } catch (e) { rec = null; }
};

/* ---- chats: autosave, sidebar, modes ---- */
const KEY = "kensei-chats", CURK = "kensei-cur";
let chats = [], curId = null, mode = "auto";
const MODES = {
  auto:"",
  build:"Build mode: deliver a complete, polished, working solution.",
  debug:"Debug mode: find the root cause, explain it in one or two sentences, then show the fixed code with minimal changes.",
  explain:"Explain mode: explain clearly and simply with a short example. Include code only if it helps.",
  review:"Review mode: review the code for bugs, security, performance and readability. List the top issues, then give improved code."
};
function loadAll() {
  try { chats = JSON.parse(localStorage.getItem(KEY) || "[]"); curId = localStorage.getItem(CURK) || null; mode = localStorage.getItem("kensei-mode") || "auto"; } catch (e) { chats = []; }
  if (!Array.isArray(chats)) chats = [];
}
function persist() { try { localStorage.setItem(KEY, JSON.stringify(chats.slice(0, 40))); localStorage.setItem(CURK, curId || ""); } catch (e) {} }
function trimmed(h) { return h.map(m => m.content.length > 20000 ? { ...m, content:m.content.slice(0, 20000) + "\n[trimmed]" } : m); }
function saveCurrent() {
  if (!history.length) { if (curId) { chats = chats.filter(c => c.id !== curId); curId = null; persist(); drawSaved(); } return; }
  if (!curId) curId = String(Date.now());
  const title = (history[0].content.split("\n")[0] || "Chat").slice(0, 48);
  chats = chats.filter(c => c.id !== curId); chats.unshift({ id:curId, title, history:trimmed(history), t:Date.now() });
  persist(); drawSaved();
}
function openChat(id) {
  const c = chats.find(x => x.id === id); if (!c) return;
  if (busy) { note.textContent = "Wait for the answer to finish, or tap Stop."; return; }
  curId = id; history = c.history.map(m => ({ ...m })); chat.textContent = "";
  if (history.length && history[history.length - 1].role === "user") { const last = history.pop(); input.value = last.content.split("\n\n--- File:")[0]; input.dispatchEvent(new Event("input")); }
  if (!history.length) showEmpty();
  history.forEach((m, i) => add(m.role === "user" ? "user" : "ai", m.role === "user" ? m.content.split("\n\n--- File:")[0] : m.content, m.role !== "user" && i >= history.length - 2));
  closeDrawer(); persist(); drawSaved(); chat.scrollTop = chat.scrollHeight;
}
function drawSaved() {
  const box = $("svlist"); box.textContent = "";
  if (!chats.length) { const e = document.createElement("div"); e.className = "empty"; e.style.marginTop = "6vh"; e.textContent = "Your chats are saved here automatically."; box.append(e); return; }
  chats.forEach(it => {
    const row = document.createElement("div"); row.className = "sitem" + (it.id === curId ? " cur" : "");
    const t = document.createElement("button"); t.type = "button"; t.className = "t"; t.textContent = it.title; t.onclick = () => openChat(it.id);
    const d = document.createElement("button"); d.type = "button"; d.className = "ghost"; d.setAttribute("aria-label", "Delete chat"); d.textContent = "\u00d7";
    d.onclick = () => { chats = chats.filter(x => x.id !== it.id); if (it.id === curId) { curId = null; history = []; showEmpty(); } persist(); drawSaved(); };
    row.append(t, d); box.append(row);
  });
}
function openDrawer() { $("sv").classList.add("on"); }
function closeDrawer() { $("sv").classList.remove("on"); }
$("hb").onclick = openDrawer; $("svx").onclick = closeDrawer; $("svnew").onclick = () => $("clear").click();
$("mSaved").onclick = () => { $("menu").classList.remove("on"); openDrawer(); };
function setMode(m) {
  mode = MODES[m] !== undefined ? m : "auto";
  document.querySelectorAll("#modes button").forEach(b => b.classList.toggle("on", b.dataset.m === mode));
  try { localStorage.setItem("kensei-mode", mode); } catch (e) {}
}
document.querySelectorAll("#modes button").forEach(b => b.onclick = () => setMode(b.dataset.m));
input.addEventListener("input", () => { try { localStorage.setItem("kensei-draft", input.value); } catch (e) {} });
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("clear").click(); input.focus(); } });
document.addEventListener("visibilitychange", () => { if (document.hidden) saveCurrent(); });
addEventListener("pagehide", saveCurrent);
function restore() {
  loadAll(); setMode(mode);
  try { const d = localStorage.getItem("kensei-draft"); if (d) { input.value = d; input.dispatchEvent(new Event("input")); } } catch (e) {}
  if (curId && chats.some(c => c.id === curId)) openChat(curId); else { curId = null; showEmpty(); drawSaved(); }
}
restore();
(async () => {
  try {
    const r = await fetch("/api/health");
    if (!r.ok) throw new Error("backend unavailable");
    note.textContent = "Kensei AI · Gemini backend ready";
  } catch (_) {
    note.textContent = "Gemini backend not connected yet · deploy the Cloudflare project";
  }
})();
</script>
